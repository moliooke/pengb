<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tesseract.js OCR 庫 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f8fafc;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col">

    <!-- Header Navigation -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-blue-600 p-2 rounded-lg text-white">
                    <i data-lucide="map-pin" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight">全台郵遞區號與門牌行政區精準查詢</h1>
                    <p class="text-xs text-slate-400">完整收錄全台 368 鄉鎮市區與防亂碼即時掃描</p>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex flex-col space-y-6">

        <!-- Navigation Tabs (兩分頁設計) -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-1 flex space-x-1">
            <button id="tab-scan" onclick="switchTab('scan')" class="flex-1 py-3 px-4 rounded-lg text-sm font-medium transition-all duration-150 flex items-center justify-center space-x-2 bg-blue-50 text-blue-600 font-semibold shadow-sm">
                <i data-lucide="camera" class="w-4 h-4"></i>
                <span>📷 即時相機掃描</span>
            </button>
            <button id="tab-search" onclick="switchTab('search')" class="flex-1 py-3 px-4 rounded-lg text-sm font-medium transition-all duration-150 flex items-center justify-center space-x-2 text-slate-600 hover:bg-slate-50">
                <i data-lucide="search" class="w-4 h-4"></i>
                <span>⌨️ 手打輸入搜尋</span>
            </button>
        </div>

        <!-- Section 1: Live Camera Scan View (即時相機預覽與掃描頁面) -->
        <section id="view-scan" class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center space-y-4">
                <div class="max-w-md mx-auto space-y-3">
                    <h2 class="text-lg font-bold text-slate-800">開啟相機即時對準地址</h2>
                    <p class="text-xs text-slate-500">請將地址平穩對準框內。點擊「擷取畫面辨識」系統將自動過濾亂碼並比對精準行政區。</p>
                    
                    <!-- 即時相機視訊預覽框 -->
                    <div class="relative w-full bg-slate-900 rounded-2xl overflow-hidden shadow-inner aspect-video flex items-center justify-center">
                        <video id="liveVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                        <canvas id="captureCanvas" class="hidden"></canvas>
                        <!-- 瞄準框裝飾 -->
                        <div class="absolute inset-8 border-2 border-dashed border-white/50 rounded-xl pointer-events-none flex items-center justify-center">
                            <span class="bg-black/60 text-white text-[10px] px-2 py-1 rounded">請將地址置於框內</span>
                        </div>
                    </div>

                    <div class="flex space-x-2">
                        <button onclick="captureAndScan()" class="flex-1 py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition flex items-center justify-center space-x-2 text-sm">
                            <i data-lucide="scan" class="w-4 h-4"></i>
                            <span>⚡ 擷取畫面並辨識</span>
                        </button>
                        <button onclick="document.getElementById('fileInput').click()" class="py-3.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl transition flex items-center justify-center space-x-1 text-sm">
                            <i data-lucide="image" class="w-4 h-4"></i>
                            <span>相簿</span>
                        </button>
                        <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)" class="hidden">
                    </div>
                </div>

                <div id="ocrStatus" class="text-xs font-bold text-blue-600 my-2"></div>

                <!-- 掃描與解析結果顯示卡片 -->
                <div id="scanResultBox" class="hidden max-w-md mx-auto mt-4 p-5 bg-blue-50 border border-blue-100 rounded-2xl text-left space-y-3 shadow-sm">
                    <div class="text-xs font-semibold text-blue-600 uppercase tracking-wider">辨識與解析結果</div>
                    <div>
                        <div class="text-xs text-slate-500">過濾後辨識文字：</div>
                        <div id="scanRawText" class="text-xs font-mono bg-white p-2 rounded border border-blue-200 mt-1 text-slate-700 break-all">---</div>
                    </div>
                    <div id="scanResultContent" class="pt-2 border-t border-blue-200 space-y-2">
                        <!-- 動態帶入結果或歧義警告 -->
                    </div>
                </div>
            </div>
        </section>

        <!-- Section 2: Manual Search View (手打輸入搜尋頁面) -->
        <section id="view-search" class="hidden space-y-6">
            <!-- Search Bar Box -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-5 h-5"></i>
                    </div>
                    <input type="text" id="single-search-input" oninput="handleSingleSearch()" placeholder="請輸入中文或英文地址關鍵字 (例：Zhongzheng Dist, Zhongzheng Dist Keelung...)" class="w-full pl-11 pr-12 py-3.5 bg-slate-50 border border-slate-300 text-slate-900 rounded-xl focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white text-base transition duration-150 shadow-inner">
                    <button onclick="clearSingleSearch()" id="clear-search-btn" class="hidden absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-slate-600">
                        <i data-lucide="x-circle" class="w-5 h-5"></i>
                    </button>
                </div>
                
                <!-- Quick Filter Tags -->
                <div class="mt-4 flex flex-wrap items-center gap-2 text-xs text-slate-500">
                    <span class="font-medium text-slate-600">測試模糊與精準：</span>
                    <button onclick="fillSearch('Zhongzheng Dist')" class="px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 rounded-md transition font-medium">⚠️ 模糊測試: Zhongzheng Dist</button>
                    <button onclick="fillSearch('Zhongzheng Dist Keelung')" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded-md transition">基隆中正區 (完整)</button>
                    <button onclick="fillSearch('Zhongzheng Dist, Taipei City')" class="px-2.5 py-1 bg-slate-100 hover:bg-blue-50 hover:text-blue-600 rounded-md transition">台北中正區 (完整)</button>
                    <button onclick="fillSearch('Xinyi Dist')" class="px-2.5 py-1 bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 rounded-md transition font-medium">⚠️ 模糊測試: Xinyi Dist</button>
                </div>
            </div>

            <!-- Stats Bar -->
            <div class="flex items-center justify-between text-xs sm:text-sm text-slate-500 px-2">
                <div>查詢結果：</div>
                <div class="flex items-center space-x-2">
                    <i data-lucide="info" class="w-4 h-4 text-slate-400"></i>
                    <span>已啟用全台同名行政區歧義提示邏輯</span>
                </div>
            </div>

            <!-- Result Container -->
            <div id="search-results" class="space-y-4">
                <!-- Dynamic cards loaded via JS -->
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-auto py-4">
        <div class="max-w-4xl mx-auto px-4 text-center text-xs text-slate-500">
            全台郵遞區號與門牌行政區精準查詢系統 &copy; 2026

        // 智慧提取門牌號碼數字
        function extractHouseNumber(addr) {
            var fullWidth = "０１２３４５６７８９";
            var halfWidth = "0123456789";
            for (var i = 0; i < fullWidth.length; i++) {
                addr = addr.split(fullWidth[i]).join(halfWidth[i]);
            }
            var match = addr.match(/(\d+)\s*號/);
            if (match) return parseInt(match[1], 10);
            match = addr.match(/No\.?\s*(\d+)/i);
            if (match) return parseInt(match[1], 10);
            match = addr.match(/(\d+)\s*(?:Sec|Section|Rd|Street|St)/i);
            if (match) return parseInt(match[1], 10);
            match = addr.match(/^(\d+)[\,\s]+/);
            if (match) return parseInt(match[1], 10);
            return 0;
        }

        // 清理 OCR 亂碼與雜訊
        function cleanOCRText(rawText) {
            // 過濾掉常見的無意義亂碼符號，保留英數字、中文、常見地址標點
            return rawText
                .replace(/[|\\_`^~<>#@$%&*+=()[\]{}]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        // 核心解析邏輯：雙語、多重可能區域歧義檢測與門牌比對引擎
        function parseTaiwanAddress(addr) {
            addr = cleanOCRText(String(addr));
            var houseNum = extractHouseNumber(addr);
            var isOdd = (houseNum % 2 !== 0);

            function has(str) { return addr.toLowerCase().indexOf(str.toLowerCase()) !== -1; }

            // Step 1: 最高優先權 — 當輸入包含明確「縣市(City) + 行政區(Dist)」時，鎖定單一結果
            for (let item of TAIWAN_DISTRICTS) {
                if (item.cityKey && has(item.cityKey)) {
                    for (let dKey of item.distKeys) {
                        if (has(dKey)) {
                            return { isMultiple: false, zip: item.zip, dist: item.zh, eng: item.eng, note: `${item.zh} (縣市+行政區明確匹配)` };

            if (has("中山北路一段") || (has("Zhongshan") && (has("Sec. 1") || has("Sec 1")))) {

            // 忠孝東路 (Zhongxiao E. Rd.)

                return { isMultiple: false, zip: "100", dist: "臺北市中正區", eng: "Zhongzheng Dist., Taipei City" };
            }
            if (has("忠孝東路三段") || has("忠孝東路四段") || (has("Zhongxiao") && (has("Sec. 3")||has("Sec. 4")||has("Sec 3")||has("Sec 4")))) return { isMultiple: false, zip: "106", dist: "臺北市大安區", eng: "Daan Dist., Taipei City" };

                    if (houseNum <= 84) return { isMultiple: false, zip: "100", dist: "臺北市中正區", eng: "Zhongzheng Dist., Taipei City", note: "雙號84號以下歸中正區" };

            // Step 3: 全台歧義比對 — 當未帶縣市時，收集全台所有符合關鍵字的區域
            let matchedDistricts = [];
            for (let item of TAIWAN_DISTRICTS) {
                let match = false;
                if (has(item.zh)) {
                    match = true;
                } else {
                    for (let dKey of item.distKeys) {
                        if (has(dKey)) {
                            match = true;
                            break;
                        }
                    }
                }
                if (match) {
                    matchedDistricts.push(item);
                }
            }

            if (matchedDistricts.length > 1) {
                return {
                    isMultiple: true,

        // State Management & Camera Stream Controls
        let activeTab = 'scan';

        // 啟動內嵌即時相機串流
        async function startCamera() {
            const videoElement = document.getElementById('liveVideo');
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } }
                });
                videoElement.srcObject = videoStream;
            } catch (err) {
                console.error("無法啟動相機:", err);
                document.getElementById('ocrStatus').innerText = "⚠️ 無法存取相機，請確認瀏覽器權限或使用相簿上傳。";
            }
        }

        // 停止相機串流
        function stopCamera() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
                videoStream = null;
            }
        }

        // Tab Switcher Logic
        function switchTab(tabKey) {
            activeTab = tabKey;
            ['scan', 'search'].forEach(key => {
                const btn = document.getElementById(`tab-${key}`);
                const view = document.getElementById(`view-${key}`);
                if (key === tabKey) {
                    btn.className = "flex-1 py-3 px-4 rounded-lg text-sm font-medium transition-all duration-150 flex items-center justify-center space-x-2 bg-blue-50 text-blue-600 font-semibold shadow-sm";
                    view.classList.remove('hidden');
                    if (key === 'scan' && !videoStream) startCamera();
                } else {
                    btn.className = "flex-1 py-3 px-4 rounded-lg text-sm font-medium transition-all duration-150 flex items-center justify-center space-x-2 text-slate-600 hover:bg-slate-50";
                    view.classList.add('hidden');
                    if (key === 'scan') stopCamera();
                }
            });
        }

        // 點擊「擷取畫面並辨識」
        function captureAndScan() {
            const video = document.getElementById('liveVideo');
            const canvas = document.getElementById('captureCanvas');
            const status = document.getElementById('ocrStatus');

            if (!video.srcObject) {
                status.innerText = "❌ 相機尚未準備就緒";
                return;
            }

            canvas.width = video.videoWidth || 1280;
            canvas.height = video.videoHeight || 720;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            status.innerText = '⏳ 正在擷取畫面並進行 OCR 辨識...';

            canvas.toBlob(blob => {
                runOCR(blob);
            }, 'image/jpeg', 0.95);
        }

        // 支援從相簿選擇圖片檔案辨識
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('ocrStatus').innerText = '⏳ 讀取上傳圖片中...';
            runOCR(file);
        }

        // 執行 Tesseract OCR 辨識核心
        function runOCR(imageSource) {
            const status = document.getElementById('ocrStatus');
            Tesseract.recognize(
                imageSource,
                'chi_tra+eng',
                {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            status.innerText = `🔍 辨識進度：${Math.round(m.progress * 100)}%`;
                        }
                    }
                }
            ).then(({ data: { text } }) => {
                status.innerText = '✅ 辨識完成！';
                const cleanText = cleanOCRText(text);
                
                document.getElementById('scanRawText').textContent = cleanText || "(未識別到有效文字)";
                
                const res = parseTaiwanAddress(cleanText);
                renderScanResult(res);
            }).catch(err => {
                status.innerText = '❌ 辨識失敗，請調整角度重新擷取。';
                console.error(err);
            });
        }

                                    <span class="font-black text-blue-700">${m.zip}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                contentBox.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">歸屬行政區：</span>
                        <span class="text-base font-bold text-slate-800">${res.dist}</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-xs text-slate-500">英文對照：</span>
                        <span class="text-xs font-medium text-slate-600">${res.eng}</span>
                    </div>
                    <div class="flex items-center justify-between pt-1">
                        <span class="text-xs text-slate-500">3碼郵遞區號：</span>
                        <span class="text-2xl font-black text-blue-700">${res.zip}</span>
                    </div>
                `;
            }
            document.getElementById('scanResultBox').classList.remove('hidden');
            lucide.createIcons();
        }

        // Single Search Execution (手打搜尋)
        function handleSingleSearch() {
            const input = document.getElementById('single-search-input').value.trim();
            const clearBtn = document.getElementById('clear-search-btn');
            const container = document.getElementById('search-results');

            clearBtn.classList.toggle('hidden', input.length === 0);

            if (!input) {
                container.innerHTML = `
                    <div class="py-12 text-center text-slate-400 bg-white rounded-2xl border border-slate-200">
                        <i data-lucide="search" class="w-8 h-8 mx-auto mb-2 opacity-40"></i>
                        <p class="font-medium text-slate-600">請在上方輸入框輸入中文或英文地址關鍵字</p>
                        <p class="text-xs text-slate-400 mt-1">例如：Zhongzheng Dist, Zhongzheng Dist Keelung...</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const res = parseTaiwanAddress(input);

            if (res.isMultiple) {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-amber-200 space-y-4">
                        <div class="flex items-start justify-between">
                            <div>
                                <span class="text-xs font-semibold text-amber-700 bg-amber-50 px-2 py-1 rounded border border-amber-200">⚠️ 模糊提示：有多個可能區域</span>
                                <h3 class="text-xl font-bold text-slate-800 mt-2">${input}</h3>
                                <p class="text-xs text-amber-600 font-medium mt-1">📌 ${res.note}</p>
                            </div>
                        </div>
                        <div class="pt-3 border-t border-slate-100 space-y-3">
                            <div class="text-xs font-bold text-slate-500">找到下列符合的區域，點選可填入完整名稱精準比對：</div>
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                ${res.matches.map(m => `
                                    <div onclick="fillSearch('${m.zh}')" class="p-3 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl cursor-pointer transition flex items-center justify-between">
                                        <div>
                                            <div class="font-bold text-slate-800 text-sm">${m.zh}</div>
                                            <div class="text-xs text-slate-400">${m.eng}</div>
                                        </div>
                                        <div class="text-lg font-black text-blue-700 bg-white px-2.5 py-1 rounded-lg border border-slate-200 shadow-sm">${m.zip}</div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
                        <div class="flex items-start justify-between">
                            <div>
                                <span class="text-xs font-semibold text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100">雙語匹配成功</span>
                                <h3 class="text-xl font-bold text-slate-800 mt-2">${input}</h3>
                                ${res.note ? `<p class="text-xs text-emerald-600 font-medium mt-1">📌 判定規則：${res.note}</p>` : ''}
                            </div>
                            <span class="text-3xl font-black text-blue-700 bg-blue-50 px-3 py-1.5 rounded-xl border border-blue-100">${res.zip}</span>
                        </div>
                        <div class="pt-3 border-t border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-2 text-sm text-slate-600">
                            <div>
                                <div>歸屬區域：<strong class="text-slate-800">${res.dist}</strong></div>
                                <div class="text-xs text-slate-400 mt-0.5">${res.eng}</div>
                            </div>
                            <button onclick="copyToClipboard('${res.zip}', '${res.dist} ${input}')" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 shadow-sm">
                                <i data-lucide="copy" class="w-4 h-4"></i>
                                <span>複製結果</span>
                            </button>
                        </div>
                    </div>
                `;
            }

            lucide.createIcons();
        }

        function clearSingleSearch() {
            document.getElementById('single-search-input').value = '';
            handleSingleSearch();
        }

        function fillSearch(term) {
            switchTab('search');
            document.getElementById('single-search-input').value = term;
            handleSingleSearch();
        }

        // Copy Helper
        function copyToClipboard(zip, text) {
            const payload = `[${zip}] ${text}`;
            executeCopy(payload);
        }

        function executeCopy(text) {
            const dummy = document.createElement("textarea");
            document.body.appendChild(dummy);
            dummy.value = text;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);
            showToast(`已複製：${text}`);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').textContent = msg;
            toast.classList.remove('hidden');
            setTimeout(() => {
                toast.classList.add('hidden');
            }, 2500);
        }
    </script>
</body>
</html>
